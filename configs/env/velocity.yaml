defaults:
  - base
  - _self_

command:
  _target_: microduck.env.mdp.command.VelocityCommand
  ranges:
    lin_vel_x: [-0.4, 0.4]
    lin_vel_y: [-0.3, 0.3]
    ang_vel_z: [-1.0, 1.0]
  resample: [3.0, 8.0]
  standing_prob: 0.1
  turn_in_place_prob: 0.15

action:
  _target_: microduck.env.mdp.action.JointPositionAction
  # joint_names: [".*"]
  joint_names: ["^(?!neck|head).*"]

observation:
  _target_: microduck.env.mdp.observation.ObservationManager
  groups:
    policy:
      base_ang_vel: {}
      projected_gravity: {}
      command: {func: velocity_command}
      joint_pos: {func: joint_pos_rel}
      joint_vel: {}
      last_action: {}
    critic:
      base_lin_vel: {}          # privileged: critic only
      base_ang_vel: {}
      projected_gravity: {}
      command: {func: velocity_command}
      joint_pos: {func: joint_pos_rel}
      joint_vel: {}
      last_action: {}

reward:
  _target_: microduck.env.mdp.reward.RewardManager
  terms:
    track_lin_vel_xy: {weight: 2.0, params: {std: 0.316}}   # sqrt(0.1)
    track_ang_vel_z:  {weight: 2.0, params: {std: 0.707}}   # sqrt(0.5)
    upright:          {weight: 2.0, params: {std: 0.224}}   # sqrt(0.05)
    action_rate_l2:   {weight: -0.1}
    feet_air_time:
      weight: 3.0
      params: {threshold_min: 0.125, threshold_max: 0.3, command_threshold: 0.01}
    pose:
      weight: 1.0
      params:
        joint_names: ["^(?!neck|head).*"]   # legs only; head/neck are not pulled to default
        walking_threshold: 0.01
        std_standing: {".*hip_yaw.*": 0.1, ".*hip_roll.*": 0.05, ".*hip_pitch.*": 0.15, ".*knee.*": 0.15, ".*ankle.*": 0.1}
        std_walking:  {".*hip_yaw.*": 0.3, ".*hip_roll.*": 0.05, ".*hip_pitch.*": 0.4, ".*knee.*": 0.4, ".*ankle.*": 0.25}

termination:
  _target_: microduck.env.mdp.termination.TerminationManager
  terms:
    time_out: {time_out: true}
    fell_over: {func: bad_orientation, params: {limit_angle: 1.22}}   # 70 deg
    nan_state: {}
    # base_height: {func: root_height_below, params: {min_height: 0.06}}