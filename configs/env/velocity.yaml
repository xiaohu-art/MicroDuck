defaults:
  - base
  - _self_

command:
  _target_: microduck.env.mdp.command.VelocityCommand
  ranges:
    lin_vel_x: [-0.4, 0.4]
    lin_vel_y: [-0.3, 0.3]
    ang_vel_z: [-1.0, 1.0]
  resample: [3.0, 8.0]
  standing_prob: 0.1
  turn_in_place_prob: 0.15

action:
  _target_: microduck.env.mdp.action.JointPositionAction
  joint_names: [".*"]

observation:
  policy:
    _target_: microduck.env.mdp.observation.ObservationGroup
    terms:
      base_ang_vel: {}
      projected_gravity: {}
      command: {func: velocity_command}
      joint_pos: {func: joint_pos_rel}
      joint_vel: {}
      last_action: {}
  critic:
    _target_: microduck.env.mdp.observation.ObservationGroup
    terms:
      base_lin_vel: {}          # privileged: critic only
      base_ang_vel: {}
      projected_gravity: {}
      command: {func: velocity_command}
      joint_pos: {func: joint_pos_rel}
      joint_vel: {}
      last_action: {}

reward: null

termination: null